name: whats-new

# Ensures user-facing changes ship with a "What's New" entry (or an explicit
# [whats-new: none] opt-out). Mirrors the local pre-commit hook, enforced in CI.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require a What's New entry (or opt-out)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/check-whats-new.mjs
