[build]
  command = "npm install && npm run build"
  publish = "dist"

# Sign in with Hive: its setup is in src/config/hive.js. If VITE_HIVE_ORIGIN or
# HIVE_APP_ID are ever overridden in Netlify, they end up in the built site on
# purpose, so the secret scan shouldn't flag them.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_HIVE_ORIGIN,HIVE_APP_ID"
  # Supabase's publishable key (src/config/hive.js) is public by design.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "sb_publishable_fZo1FUg_j4O1EHH-W2Jr1A_4P8W3o2S"

# Sign in with Hive (src/hive.js). Must come before /api/* — Netlify uses
# the first rule that matches.
[[redirects]]
  from = "/api/hive/exchange"
  to = "/.netlify/functions/hive-exchange"
  status = 200
  force = true

# Connected apps (mint/list/revoke, Firebase sign-in auth). Must come before
# /api/* — Netlify uses the first rule that matches.
[[redirects]]
  from = "/api/connections"
  to = "/.netlify/functions/connections"
  status = 200
  force = true

[[redirects]]
  from = "/api/connections/*"
  to = "/.netlify/functions/connections/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
